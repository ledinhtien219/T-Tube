name: Export T Tube v1.0.75 Mazda PAD Wallpaper Fix APK
on:
  push:
    branches: [ "test/ttube-v1.0.74-mazda-pad-smooth" ]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1
      - run: test -f ~/.android/debug.keystore
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/wallpaper-iptv-home-regression.test.cjs
      - run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.75-build270-Mazda-PAD-wallpaper-fix
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
