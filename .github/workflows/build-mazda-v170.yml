name: Build T Tube Mazda v1.0.70

on:
  push:
    branches: [ "mazda/v170-rotary" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttube-mazda-v170-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mazda rotary APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run regression tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build Mazda debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Mazda APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.70-mazda1-build262-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
