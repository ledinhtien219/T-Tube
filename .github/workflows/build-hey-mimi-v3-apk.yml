name: Build Hey Mimi v3 test APK

on:
  push:
    branches:
      - test/hey-mimi-v3-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hey-mimi-v3-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply Mimi assistant and two-turn Hey Mimi
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < ci/hey-mimi/TTube_assistant_mimi.patch
          patch --batch --forward -p1 < ci/hey-mimi/TTube_HeyMimi_v2.patch
          patch --batch --forward -p1 < ci/hey-mimi/migrate-name.patch
          test -f app/src/main/java/com/carhud/aaproxy/HeyMimiConversation.kt
          test -f app/src/main/java/com/carhud/aaproxy/TtubeAssistant.kt
          ! grep -q 'DEFAULT_NAME = "Tubi"' app/src/main/java/com/carhud/aaproxy/AssistantConfig.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable debug certificate
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1
      - name: Ensure debug signing key for test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "WARNING: New debug-only key (may require uninstall of old install)"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Run Mimi unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*AssistantIntentParserTest' --tests '*HeyMimiConversationTest' --stacktrace --no-daemon
      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/*.apk
          sha256sum app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TTube-Hey-Mimi-v3-1.1.8-build306-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
