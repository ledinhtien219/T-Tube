name: Build v1.0.94 YouTube Play Test SIGNED AAB

on:
  push:
    branches:
      - "release/play-v1.0.94-youtube-fermata-test"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/.play/ttube-play-upload.jks
      EXPECTED_PLAY_SHA1: 6B:29:49:A3:DA:2C:6D:10:CD:4F:E7:BD:8F:4E:74:04:2B:41:29:07

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore required Play upload key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PLAY_UPLOAD_KEYSTORE_BASE64:-}" || { echo "Missing PLAY_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "${PLAY_UPLOAD_STORE_PASSWORD:-}" || { echo "Missing PLAY_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "${PLAY_UPLOAD_KEY_ALIAS:-}" || { echo "Missing PLAY_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "${PLAY_UPLOAD_KEY_PASSWORD:-}" || { echo "Missing PLAY_UPLOAD_KEY_PASSWORD"; exit 1; }
          mkdir -p "$(dirname "$PLAY_UPLOAD_KEYSTORE_PATH")"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE_PATH"
          chmod 600 "$PLAY_UPLOAD_KEYSTORE_PATH"

      - name: Verify exact Google Play upload certificate
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA1="$(keytool -list -v             -keystore "$PLAY_UPLOAD_KEYSTORE_PATH"             -storepass "$PLAY_UPLOAD_STORE_PASSWORD"             -alias "$PLAY_UPLOAD_KEY_ALIAS" 2>/dev/null             | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
          echo "Expected Play SHA1: $EXPECTED_PLAY_SHA1"
          echo "Actual key SHA1:    $ACTUAL_SHA1"
          test "$PLAY_UPLOAD_KEY_ALIAS" = "ttube-play-upload"
          test "$ACTUAL_SHA1" = "$EXPECTED_PLAY_SHA1"

      - name: Verify exact Play test source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.ledinhtien.ttube"' app/build.gradle.kts
          grep -q 'versionCode = 293' app/build.gradle.kts
          grep -q 'versionName = "1.0.94"' app/build.gradle.kts
          grep -q 'v.currentTime = d' app/src/main/java/com/carhud/aaproxy/YouTubeAdBlocker.kt
          grep -q 'video.currentTime = duration' app/src/main/java/com/carhud/aaproxy/YouTubePlayerHelper.kt

      - name: Run focused YouTube regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/youtube-*.test.cjs tests/v152-youtube-search-toolbar.test.cjs tests/v160-youtube-fast-search.test.cjs

      - name: Build signed Play AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB signature and Play certificate
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt
          ! grep -q "jar is unsigned" /tmp/jarsigner.txt
          AAB_SHA1="$(keytool -printcert -jarfile "$AAB" 2>/dev/null | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
          echo "Expected Play SHA1: $EXPECTED_PLAY_SHA1"
          echo "AAB signer SHA1:    $AAB_SHA1"
          test "$AAB_SHA1" = "$EXPECTED_PLAY_SHA1"
          cp "$AAB" TTube_v1.0.94_build293_CHPlay_Tester_PLAYKEY.aab
          sha256sum TTube_v1.0.94_build293_CHPlay_Tester_PLAYKEY.aab

      - name: Upload Play-key signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.94-build293-CHPlay-Tester-PLAYKEY-AAB
          path: TTube_v1.0.94_build293_CHPlay_Tester_PLAYKEY.aab
          if-no-files-found: error
          retention-days: 14
