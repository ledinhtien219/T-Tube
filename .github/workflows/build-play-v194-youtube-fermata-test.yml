name: Build v1.0.94 YouTube Fermata Test APK

on:
  push:
    branches:
      - "test/play-v1.0.94-youtube-fermata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-v194-youtube-fermata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build T Tube v1.0.94 test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Verify v1.0.94 base and YouTube patch
        shell: bash
        run: |
          chmod +x gradlew
          grep -q 'versionName = "1.0.94"' app/build.gradle.kts
          grep -q 'versionCode = 292' app/build.gradle.kts
          grep -q "Fermata-style fallback" app/src/main/java/com/carhud/aaproxy/YouTubePlayerHelper.kt
          grep -q "Keep YouTube's network graph intact" app/src/main/java/com/carhud/aaproxy/YouTubeAdBlocker.kt

      - name: Run YouTube regression tests
        shell: bash
        run: |
          set -e
          for f in tests/youtube-*.test.cjs tests/v152-youtube-search-toolbar.test.cjs tests/v160-youtube-fast-search.test.cjs tests/v170-youtube-scroll-seekbar.test.cjs; do
            test -f "$f" || continue
            echo "RUN $f"
            node "$f"
          done

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.94-YouTube-Fermata-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
