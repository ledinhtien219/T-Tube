name: Hey Mimi v7 debug APK phone startup smoke
on:
  push:
    branches: ["test/hey-mimi-v7-emulator-smoke"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  phone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact previously built v7 APK
        uses: actions/download-artifact@v4
        with:
          name: TTube-Hey-Mimi-v7-build308-unsigned-ci-and-debug
          run-id: 40877512304
          github-token: ${{ github.token }}
          path: built
      - name: Confirm APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s built/TTube_v1.1.10_debug.apk
          sha256sum built/TTube_v1.1.10_debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open app in Android 15 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash ci/hey-mimi/v7-phone-smoke.sh
      - name: Save emulator crash log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hey-Mimi-v7-phone-startup-evidence
          path: smoke-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
