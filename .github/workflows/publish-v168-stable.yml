name: Publish T Tube v1.0.68 Stable

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-v168-stable.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Publish v1.0.68 Stable
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: 81882b6d3b33c134db123428e4cb11af1640d7cc
          fetch-depth: 0

      - name: Verify v1.0.68 build 259
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81882b6d3b33c134db123428e4cb11af1640d7cc"
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          test "$VERSION_NAME" = "1.0.68"
          test "$VERSION_CODE" = "259"
          git fetch origin main --quiet
          git show origin/main:update.json > /tmp/current-stable.json
          CURRENT_CODE=$(jq -r '.versionCode' /tmp/current-stable.json)
          test "$CURRENT_CODE" -lt "259"
          echo "TARGET_SHA=81882b6d3b33c134db123428e4cb11af1640d7cc" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; aborting stable publication."
            exit 1
          }

      - name: Run all regression and JVM tests
        run: |
          set -e
          chmod +x gradlew
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build stable APK and Android tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run cable + TikTok runtime smoke tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            set -e
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.CarDisconnectWatchdogRuntimeTest --stacktrace
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.TikTokRuntimeSmokeTest --stacktrace

      - name: Create immutable v1.0.68 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/TTube_v1.0.68_debug.apk"
          test -f "$APK"
          if gh release view "v1.0.68" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "v1.0.68" 2>/dev/null || true)
            test "$TAG_SHA" = "$TARGET_SHA"
          else
            cat > /tmp/release-notes.txt <<'EOF'
          - Thêm mục Zalo T Tube trong Cài đặt/Hỗ trợ, mở thẳng nhóm cộng đồng chính thức.
          - Sửa WakeLock: chỉ giữ CPU thức khi media thực sự đang phát hoặc cần tiếp tục phát nền.
          - Cải thiện nhận diện rút cáp Android Auto: USB mất vẫn shutdown dù điện thoại còn sạc không dây/nguồn khác.
          - Giới hạn Waze HLP WebSocket về localhost để tránh thiết bị khác trong mạng gửi dữ liệu vào HUD.
          - Gỡ đường mở khóa Developer công khai khỏi màn kích hoạt.
          - Bật đầy đủ JVM unit tests trong CI; giữ toàn bộ regression/runtime test Android Auto và TikTok.
          EOF
            gh release create "v1.0.68" "$APK" \
              --target "$TARGET_SHA" \
              --title "T Tube v1.0.68 (STABLE)" \
              --notes-file /tmp/release-notes.txt
          fi

      - name: Promote v1.0.68 in update.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout -B stable-manifest origin/main

          python3 - <<'PY'
          import datetime, json
          manifest = {
              "channel": "stable",
              "approved": True,
              "versionCode": 259,
              "versionName": "1.0.68",
              "downloadUrl": "https://github.com/ledinhtien219/THTV/releases/download/v1.0.68/TTube_v1.0.68_debug.apk",
              "approvedCommit": "81882b6d3b33c134db123428e4cb11af1640d7cc",
              "approvedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
              "changelog": [
                  "Thêm mục Zalo T Tube trong Cài đặt/Hỗ trợ, mở nhóm cộng đồng chính thức.",
                  "Sửa WakeLock để giảm hao pin khi app ở nền nhưng media không phát.",
                  "Cải thiện nhận diện rút cáp Android Auto ngay cả khi điện thoại còn nguồn sạc khác.",
                  "Khóa Waze HLP WebSocket về localhost và gỡ Developer bypass khỏi bản public.",
                  "CI chạy đầy đủ JVM unit tests cùng regression/runtime test trước khi phát hành."
              ]
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "release: publish v1.0.68 stable"
          git push origin HEAD:main
