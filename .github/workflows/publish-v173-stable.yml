# Source files verified against local Git blob hashes before stable publication.
name: Publish T Tube v1.0.73 Stable

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-v173-stable.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Publish v1.0.73 Stable
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify v1.0.73 build 264
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          test "$VERSION_NAME" = "1.0.73"
          test "$VERSION_CODE" = "264"
          git fetch origin main --quiet
          git show origin/main:update.json > /tmp/current-stable.json
          CURRENT_CODE=$(jq -r '.versionCode' /tmp/current-stable.json)
          test "$CURRENT_CODE" -lt "264"
          echo "TARGET_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; aborting stable publication."
            exit 1
          }

      - name: Check restored key against the published stable certificate
        shell: bash
        run: |
          set -euo pipefail
          CACHED_CERT=$(keytool -exportcert -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | sha256sum | cut -d ' ' -f1)
          echo "Restored key certificate SHA-256: $CACHED_CERT"
          test "$CACHED_CERT" = "dbdb9e695d351e19899e17d9fd9258b11f9cc24ab6df386c21c138d5a70a3de2"

      - name: Run all regression and JVM tests
        run: |
          set -e
          chmod +x gradlew
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build stable APK and Android tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify compatibility with the current stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$(jq -r '.downloadUrl' /tmp/current-stable.json)" -o /tmp/current-stable.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          export APKSIGNER
          python3 - <<'PY'
          import os, re, subprocess
          def certificate(path):
              report = subprocess.check_output([os.environ["APKSIGNER"], "verify", "--print-certs", path], text=True)
              print(report)
              for line in report.splitlines():
                  label = line.upper().replace("-", "").replace(" ", "").replace("_", "")
                  if "CERTIFICATE" in label and "SHA256" in label:
                      found = re.search(r"[0-9a-fA-F]{64}", line)
                      if found:
                          return found.group(0).lower()
              raise SystemExit("No certificate SHA-256 digest in apksigner output")
          old = certificate("/tmp/current-stable.apk")
          new = certificate("app/build/outputs/apk/debug/TTube_v1.0.73_debug.apk")
          expected = "dbdb9e695d351e19899e17d9fd9258b11f9cc24ab6df386c21c138d5a70a3de2"
          if old != new or new != expected:
              raise SystemExit(f"Stable signing mismatch: published={old}, candidate={new}")
          print("Stable signing compatibility verified:", new)
          PY

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run cable + TikTok runtime smoke tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            set -e
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.AppSwitchRuntimeTest,com.carhud.aaproxy.ProjectionDensityRuntimeTest --stacktrace
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.CarDisconnectWatchdogRuntimeTest --stacktrace
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.TikTokRuntimeSmokeTest --stacktrace

      - name: Create immutable v1.0.73 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/TTube_v1.0.73_debug.apk"
          test -f "$APK"
          git archive --format=zip --output=/tmp/TTube_v1.0.73_source.zip "$TARGET_SHA"
          cp "$APK" /tmp/TTube_v1.0.73_debug.apk
          (cd /tmp && sha256sum TTube_v1.0.73_debug.apk TTube_v1.0.73_source.zip > SHA256SUMS.txt)
          if gh release view "v1.0.73" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "v1.0.73" 2>/dev/null || true)
            test "$TAG_SHA" = "$TARGET_SHA"
          else
            cat > /tmp/release-notes.txt <<'EOF'
          - Sửa nhận diện DPI màn xe, cập nhật WebView khi đổi màn và giữ viewport video theo màn đích.
          - Sửa tải trang trùng khi chuyển app, chặn callback cũ và khôi phục vị trí video một lần khi player sẵn sàng.
          - Giảm dựng lại thanh điều khiển và đọc lại ảnh nền khi quay về app/Home; giữ trang TikTok khi bấm lại biểu tượng.
          - Giữ các cập nhật phân loại màn siêu rộng trên main. Kèm source và SHA256SUMS.
          - Regression, JVM tests, kiểm thử chuyển app/DPI, cable và TikTok runtime phải đạt trước khi phát hành.
          - Chưa chứng nhận tương thích với mọi đầu màn xe trên thị trường.
          EOF
            gh release create "v1.0.73" "$APK" /tmp/TTube_v1.0.73_source.zip /tmp/SHA256SUMS.txt \
              --target "$TARGET_SHA" \
              --title "T Tube v1.0.73 (STABLE)" \
              --notes-file /tmp/release-notes.txt
          fi

      - name: Promote v1.0.73 in update.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout -B stable-manifest origin/main

          python3 - <<'PY'
          import datetime, json
          manifest = {
              "channel": "stable",
              "approved": True,
              "versionCode": 264,
              "versionName": "1.0.73",
              "downloadUrl": "https://github.com/ledinhtien219/T-Tube/releases/download/v1.0.73/TTube_v1.0.73_debug.apk",
              "approvedCommit": "${{ github.sha }}",
              "approvedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
              "changelog": [
                  "Sửa nhận diện DPI và viewport video theo màn xe.",
                  "Cải thiện chuyển app: tránh tải trang trùng và callback cũ.",
                  "Khôi phục vị trí video một lần, giữ trạng thái tạm dừng.",
                  "Giảm dựng lại thanh điều khiển và đọc lại ảnh nền."
              ]
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "release: publish v1.0.73 stable"
          git push origin HEAD:main
