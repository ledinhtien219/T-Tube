name: Build T Tube v1.0.70 APK

on:
  push:
    branches: [ "main", "test/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttube-v170-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build T Tube v1.0.70 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare checked-in v1.0.70 source
        shell: bash
        run: |
          chmod +x gradlew
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3
          grep -q 'phoneAppsPager' app/src/main/res/layout/activity_main.xml
          grep -q 'PREF_THEME_MODE = SettingsActivity.KEY_THEME_MODE' app/src/main/java/com/carhud/aaproxy/MainActivity.kt
          grep -q 'prepareFullscreenTransition' app/src/main/java/com/carhud/aaproxy/CarPresentation.kt
          grep -q 'tiktok.com/search?q=' app/src/main/java/com/carhud/aaproxy/TikTokWebPolicy.kt
          grep -q 'DESKTOP_UA' app/src/main/java/com/carhud/aaproxy/TikTokWebPolicy.kt
          grep -q 'data-ttube-app-promo-wall' app/src/main/java/com/carhud/aaproxy/TikTokWebPolicy.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run T Tube regression tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build T Tube debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile TikTok runtime smoke test
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run live TikTok runtime smoke test
        timeout-minutes: 12
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >
            bash -c 'set +e;
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.CarUltrawideTemplateRuntimeTest --stacktrace;
            template_status=$?;
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.CarHostModeRuntimeTest --stacktrace;
            host_status=$?;
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.CarDisconnectWatchdogRuntimeTest --stacktrace;
            cable_status=$?;
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.TikTokRuntimeSmokeTest --stacktrace;
            tiktok_status=$?;
            mkdir -p smoke-artifacts;
            adb logcat -d -v time | grep -E "TTUBE_SMOKE|CarDisconnectWatchdog|CarAppShutdownManager" > smoke-artifacts/runtime.log || true;
            adb exec-out screencap -p > smoke-artifacts/final-screen.png || true;
            if [ $template_status -ne 0 ] || [ $host_status -ne 0 ] || [ $cable_status -ne 0 ] || [ $tiktok_status -ne 0 ]; then exit 1; fi;
            exit 0'

      - name: Upload TikTok smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.70-build261-smoke-evidence
          path: smoke-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      # APK is intentionally uploaded only after the live Android/WebView smoke
      # test succeeds. A black/empty TikTok feed or search blocks distribution.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.70-build261-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
