name: Build T Tube v1.0.57 APK

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build T Tube v1.0.57 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply T Tube v1.0.57 source overlay
        shell: bash
        run: |
          cat ci/v157/part* | tr -d '\n\r' | base64 -d > /tmp/TTube_v1.0.57_overlay.tar.xz
          tar -xJf /tmp/TTube_v1.0.57_overlay.tar.xz -C .
          chmod +x gradlew
          grep -E 'version(Code|Name)' app/build.gradle.kts | head -2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Build T Tube debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.57-build244-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
