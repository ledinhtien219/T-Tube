name: Build T Tube v1.0.65 APK

on:
  push:
    branches: [ "test/ttube-v1.0.65-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build T Tube v1.0.65 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply T Tube v1.0.57 source overlay
        shell: bash
        run: |
          cat ci/v157/part* | tr -d '\n\r' | base64 -d > /tmp/TTube_v1.0.57_overlay.zip
          unzip -oq /tmp/TTube_v1.0.57_overlay.zip -d .
          chmod +x gradlew

      - name: Apply T Tube v1.0.59 patch
        shell: bash
        run: |
          tr -d '\n\r' < ci/v159_patch.gz.b64 | base64 -d | gzip -dc > /tmp/v159.full.patch
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/v159.full.patch').read_text()
          chunks = s.split('diff -ruN ')
          out = []
          for chunk in chunks:
              if not chunk.strip():
                  continue
              first = chunk.splitlines()[0]
              if 'a/.github/workflows/' in first:
                  continue
              out.append('diff -ruN ' + chunk)
          Path('/tmp/v159.patch').write_text(''.join(out))
          PY
          patch -p1 < /tmp/v159.patch

      - name: Apply T Tube v1.0.60 patch
        shell: bash
        run: |
          tr -d '\n\r' < ci/v160_patch.gz.b64 | base64 -d | gzip -dc > /tmp/v160.raw.patch
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/v160.raw.patch').read_text()
          s = s.replace('/mnt/data/TTube_v1.0.59/', 'a/')
          s = s.replace('/mnt/data/TTube_v1.0.60/', 'b/')
          Path('/tmp/v160.patch').write_text(s)
          PY
          patch -p1 < /tmp/v160.patch

      - name: Apply T Tube v1.0.61 patch
        shell: bash
        run: |
          tr -d '\n\r' < ci/v161_patch.gz.b64 | base64 -d | gzip -dc > /tmp/v161.raw.patch
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/v161.raw.patch').read_text()
          s = s.replace('/mnt/data/TTube_v1.0.60/', 'a/')
          s = s.replace('/mnt/data/TTube_v1.0.61/', 'b/')
          chunks = s.split('diff -ruN ')
          out = []
          for chunk in chunks:
              if not chunk.strip():
                  continue
              first = chunk.splitlines()[0]
              if 'a/.github/workflows/' in first:
                  continue
              out.append('diff -ruN ' + chunk)
          Path('/tmp/v161.patch').write_text(''.join(out))
          PY
          patch -p1 < /tmp/v161.patch

      - name: Apply T Tube v1.0.62 patch
        shell: bash
        run: |
          tr -d '\n\r' < ci/v162_patch.gz.b64 | base64 -d | gzip -dc > /tmp/v162.raw.patch
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/v162.raw.patch').read_text()
          s = s.replace('/mnt/data/TTube_v1.0.61_work/TTube_v1.0.61/', 'a/')
          s = s.replace('/mnt/data/TTube_v1.0.62/', 'b/')
          chunks = s.split('diff -ruN ')
          out = []
          for chunk in chunks:
              if not chunk.strip():
                  continue
              first = chunk.splitlines()[0]
              if 'a/.github/workflows/' in first:
                  continue
              out.append('diff -ruN ' + chunk)
          Path('/tmp/v162.patch').write_text(''.join(out))
          PY
          patch -p1 < /tmp/v162.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/carhud/aaproxy/TikTokWebPolicy.kt')
          s = p.read_text()
          s = s.replace('Regex("Version/[\\d.]+\\s?")', 'Regex("""Version/[\\d.]+\\s?""")')
          p.write_text(s)
          PY

      - name: Apply T Tube v1.0.63 fixes
        shell: bash
        run: |
          python ci/apply_v163.py
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3

      - name: Snapshot v1.0.63 car UI
        shell: bash
        run: |
          mkdir -p /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy
          mkdir -p /tmp/ttube-v163-car/app/src/main/res/layout
          cp app/src/main/java/com/carhud/aaproxy/CarDashboardView.kt /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy/
          cp app/src/main/java/com/carhud/aaproxy/CarPresentation.kt /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy/
          cp app/src/main/java/com/carhud/aaproxy/CarHudAutoScreen.kt /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy/
          cp app/src/main/res/layout/dashboard.xml /tmp/ttube-v163-car/app/src/main/res/layout/

      - name: Apply T Tube v1.0.64 targeted fixes
        shell: bash
        run: |
          python ci/apply_v164.py
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3
          test -f tests/v164-theme-transition-tiktok.test.cjs

      - name: Apply T Tube v1.0.65 phone control hub
        shell: bash
        run: |
          python ci/apply_v165_phone.py
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3

      - name: Apply T Tube v1.0.65 car display fixes
        shell: bash
        run: |
          python ci/apply_v165_car.py
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3
          test -f tests/v165-phone-hub-car-display.test.cjs

      - name: Restore v1.0.63 car UI
        shell: bash
        run: |
          cp /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy/CarDashboardView.kt app/src/main/java/com/carhud/aaproxy/
          cp /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy/CarPresentation.kt app/src/main/java/com/carhud/aaproxy/
          cp /tmp/ttube-v163-car/app/src/main/java/com/carhud/aaproxy/CarHudAutoScreen.kt app/src/main/java/com/carhud/aaproxy/
          cp /tmp/ttube-v163-car/app/src/main/res/layout/dashboard.xml app/src/main/res/layout/
          cat > tests/v165-phone-hub-car-display.test.cjs <<'EOF'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const gradle = fs.readFileSync('app/build.gradle.kts','utf8');
          const main = fs.readFileSync('app/src/main/java/com/carhud/aaproxy/MainActivity.kt','utf8');
          const dash = fs.readFileSync('app/src/main/java/com/carhud/aaproxy/CarDashboardView.kt','utf8');

          assert.match(gradle,/versionCode = 252/);
          assert.match(gradle,/versionName = "1\.0\.65"/);

          // Phone Home is the new 3x3 app launcher.
          assert.match(main,/PHONE_HOME_PAGE_COUNT = 3/);
          assert.match(main,/PHONE_HOME_APPS_PER_PAGE = 9/);
          assert.match(main,/WebAppManager\.getEnabledApps\(this\)/);
          assert.match(main,/columnCount = 3/);
          assert.match(main,/rowCount = 3/);

          // Car dashboard visuals are restored to the v1.0.63 snapshot.
          assert.doesNotMatch(dash,/btnSettings\.visibility = View\.GONE/);
          assert.doesNotMatch(dash,/btnNotification\.visibility = View\.GONE/);
          assert.match(dash,/private lateinit var weatherIcon: ImageView/);

          console.log('PASS v1.0.65: phone 3x3 app launcher + car UI restored to v1.0.63');
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run T Tube regression tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Build T Tube debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Package final source
        shell: bash
        run: |
          rm -rf /tmp/TTube-v1.0.65-build252-source
          mkdir -p /tmp/TTube-v1.0.65-build252-source
          rsync -a --exclude '.git' --exclude '.gradle' --exclude 'app/build' --exclude 'build' ./ /tmp/TTube-v1.0.65-build252-source/
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/TTube-v1.0.65-build252-SOURCE.zip" TTube-v1.0.65-build252-source

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.65-build252-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.65-build252-SOURCE
          path: TTube-v1.0.65-build252-SOURCE.zip
          retention-days: 7
