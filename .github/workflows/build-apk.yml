name: Build T Tube v1.0.73 Performance Test

on:
  push:
    branches: [ "test/v1.0.73-perf-official" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttube-v173-perf-official-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build official v1.0.73 perf APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply official v1.0.73 performance patch
        run: |
          git apply --check ci/v1.0.73-perf-official.patch
          git apply ci/v1.0.73-perf-official.patch
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.73-perf-official-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
