name: Build T Tube v1.0.59 APK

on:
  push:
    branches: [ "test/ttube-v1.0.59-apk" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build T Tube v1.0.59 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply T Tube v1.0.57 source overlay
        shell: bash
        run: |
          cat ci/v157/part* | tr -d '\n\r' | base64 -d > /tmp/TTube_v1.0.57_overlay.zip
          unzip -oq /tmp/TTube_v1.0.57_overlay.zip -d .
          chmod +x gradlew

      - name: Apply T Tube v1.0.59 patch
        shell: bash
        run: |
          tr -d '\n\r' < ci/v159_patch.gz.b64 | base64 -d | gzip -dc > /tmp/v159.patch
          patch -p1 < /tmp/v159.patch
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run T Tube regression tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Build T Tube debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.59-build246-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
