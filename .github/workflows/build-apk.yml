name: Build T Tube v1.0.63 APK

on:
  push:
    branches: [ "test/ttube-v1.0.63-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build T Tube v1.0.63 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare checked-in v1.0.63 source
        shell: bash
        run: |
          chmod +x gradlew
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3
          grep -q 'phoneAppsPager' app/src/main/res/layout/activity_main.xml
          grep -q 'PREF_THEME_MODE = SettingsActivity.KEY_THEME_MODE' app/src/main/java/com/carhud/aaproxy/MainActivity.kt
          grep -q 'prepareFullscreenTransition' app/src/main/java/com/carhud/aaproxy/CarPresentation.kt
          grep -q 'search/video?q=' app/src/main/java/com/carhud/aaproxy/TikTokWebPolicy.kt
          grep -q 'recoverSearchShell' app/src/main/java/com/carhud/aaproxy/TikTokWebPolicy.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run T Tube regression tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Build T Tube debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.63-build250-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
