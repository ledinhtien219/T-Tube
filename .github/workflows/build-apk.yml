name: Build T Tube v1.0.58 APK

on:
  push:
    branches: [ "test/ttube-v1.0.58-apk" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build T Tube v1.0.58 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply T Tube v1.0.57 source overlay
        shell: bash
        run: |
          cat ci/v157/part* | tr -d '\n\r' | base64 -d > /tmp/TTube_v1.0.57_overlay.zip
          unzip -oq /tmp/TTube_v1.0.57_overlay.zip -d .
          chmod +x gradlew

      - name: Bump runtime build to v1.0.58
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text()
          text = text.replace("versionCode = 244", "versionCode = 245")
          text = text.replace('versionName = "1.0.57"', 'versionName = "1.0.58"')
          gradle.write_text(text)

          test = Path("tests/v157-tiktok-smoothness.test.cjs")
          if test.exists():
              t = test.read_text()
              t = t.replace("/versionCode = 244/", "/versionCode = 245/")
              t = t.replace('/versionName = "1\\.0\\.57"/', '/versionName = "1\\.0\\.58"/')
              test.write_text(t)

          Path("tests/v158-version-install.test.cjs").write_text(
              """const fs = require('node:fs');
"""
              """const assert = require('node:assert/strict');
"""
              """const gradle = fs.readFileSync('app/build.gradle.kts', 'utf8');
"""
              """assert.match(gradle, /applicationId = "com\\.tcar\\.auto"/);
"""
              """assert.match(gradle, /versionCode = 245/);
"""
              """assert.match(gradle, /versionName = "1\\.0\\.58"/);
"""
              """console.log('PASS v1.0.58: in-place upgrade metadata');
"""
          )
          PY
          grep -E 'applicationId|version(Code|Name)' app/build.gradle.kts | head -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; refusing to generate a different certificate."
            exit 1
          }

      - name: Run T Tube regression tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Build T Tube debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v1.0.58-build245-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
