name: Render HUD Style 7 Screenshot

on:
  push:
    branches: [ "release/play" ]
    paths:
      - ".github/workflows/render-hud-style7.yml"
      - "app/src/debug/**"
      - "app/src/main/java/com/carhud/aaproxy/VietmapHudOverlay.kt"
      - "app/src/main/java/com/carhud/aaproxy/WazeHudManager.kt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-hud-style7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render style 7 on Android emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create disposable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Render and capture style 7
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            set -euo pipefail
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
            apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
            test -n "$apk"
            adb install -r "$apk"

            # Make the emulator canvas match a common Android Auto landscape viewport.
            adb shell wm size 1280x720
            adb shell wm density 160
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2

            mkdir -p hud-render-artifacts

            adb shell am force-stop com.ledinhtien.ttube
            adb shell am start -W               -n com.ledinhtien.ttube/com.carhud.aaproxy.HudStyle7SmokeActivity               --ei scale 100
            sleep 3
            adb exec-out screencap -p > hud-render-artifacts/style7-100-real.png

            adb shell am force-stop com.ledinhtien.ttube
            adb shell am start -W               -n com.ledinhtien.ttube/com.carhud.aaproxy.HudStyle7SmokeActivity               --ei scale 150
            sleep 3
            adb exec-out screencap -p > hud-render-artifacts/style7-150-real.png

            adb shell dumpsys window windows > hud-render-artifacts/window.txt || true
            file hud-render-artifacts/*.png || true

      - name: Upload real HUD renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HUD-style7-real-render-${{ github.sha }}
          path: hud-render-artifacts/**
          if-no-files-found: error
          retention-days: 7
