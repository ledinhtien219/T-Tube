name: Publish T Tube v1.0.65 Stable

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-v165-stable.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Publish v1.0.65 Stable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v1.0.65 build 256
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          test "$VERSION_NAME" = "1.0.65"
          test "$VERSION_CODE" = "256"
          CURRENT_CODE=$(jq -r '.versionCode' update.json)
          test "$CURRENT_CODE" -lt "256"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; aborting stable publication."
            exit 1
          }

      - name: Run all regression tests
        run: |
          set -e
          chmod +x gradlew
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done

      - name: Build stable APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run cable + TikTok runtime smoke tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            set -e
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.CarDisconnectWatchdogRuntimeTest --stacktrace
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carhud.aaproxy.TikTokRuntimeSmokeTest --stacktrace

      - name: Create immutable v1.0.65 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/TTube_v1.0.65_debug.apk"
          test -f "$APK"
          if gh release view "v1.0.65" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "v1.0.65" 2>/dev/null || true)
            test "$TAG_SHA" = "$TARGET_SHA"
          else
            cat > /tmp/release-notes.txt <<'EOF'
          - Sửa rút cáp Android Auto: dừng audio, đóng app và kill process.
          - TikTok dùng tiktok.com trực tiếp, đăng nhập/tìm kiếm/lướt ổn định hơn.
          - TikTok tự fit theo màn hình điện thoại/Android Auto.
          - Giao diện điện thoại mặc định tối và cải thiện độ mượt WebView.
          - Thêm runtime smoke test cho mất nguồn USB và TikTok trước khi phát hành.
          EOF
            gh release create "v1.0.65" "$APK" \
              --target "$TARGET_SHA" \
              --title "T Tube v1.0.65 (STABLE)" \
              --notes-file /tmp/release-notes.txt
          fi

      - name: Promote v1.0.65 in update.json
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout -B stable-manifest origin/main

          python3 - <<'PY'
          import datetime, json, os
          manifest = {
              "channel": "stable",
              "approved": True,
              "versionCode": 256,
              "versionName": "1.0.65",
              "downloadUrl": "https://github.com/ledinhtien219/T-Tube/releases/download/v1.0.65/TTube_v1.0.65_debug.apk",
              "approvedCommit": os.environ["TARGET_SHA"],
              "approvedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
              "changelog": [
                  "Sửa rút cáp Android Auto: dừng audio và đóng ứng dụng.",
                  "TikTok dùng tiktok.com trực tiếp, cải thiện đăng nhập, tìm kiếm và cuộn feed.",
                  "Tự fit giao diện TikTok theo màn hình.",
                  "Cải thiện giao diện tối và độ mượt WebView."
              ]
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "release: publish v1.0.65 stable"
          git push origin HEAD:main
