name: Build SIGNED Hey Mimi v6 Play AAB (build 307)
on:
  push:
    branches:
      - "test/hey-mimi-v6-play-aab-build307"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttube-mimi-v6-play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Validate and build Play release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/.play/ttube-play-upload.jks
      PLAY_UPLOAD_CERT_SHA256: ${{ secrets.PLAY_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply Hey Mimi v3, v4 and v5
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < ci/hey-mimi/TTube_assistant_mimi.patch
          patch --batch --forward -p1 < ci/hey-mimi/TTube_HeyMimi_v2.patch
          patch --batch --forward -p1 < ci/hey-mimi/migrate-name.patch
          base64 --decode ci/hey-mimi/v4/MimiAssistantPanel.kt.gz.b64 | gzip -dc > app/src/main/java/com/carhud/aaproxy/MimiAssistantPanel.kt
          base64 --decode ci/hey-mimi/v4/CarPresentation.patch.gz.b64 | gzip -dc | patch --batch --forward -p1
          base64 --decode ci/hey-mimi/v4/panel-ui.test.cjs.gz.b64 | gzip -dc > tests/hey-mimi-panel-ui.test.cjs
          patch --batch --forward -p1 < ci/hey-mimi/v5-visible-avatar.patch
      - name: Apply Hey Mimi v6 AI and driving foundation
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < ci/hey-mimi/v6-ai-driving.patch
          test -s app/src/main/java/com/carhud/aaproxy/MimiSmartAssistant.kt
          test -s app/src/main/java/com/carhud/aaproxy/MimiHotwordEngine.kt
          test -s backend/mimi-proxy.mjs
          grep -q 'versionCode = 307' app/build.gradle.kts
          grep -q 'versionName = "1.1.9"' app/build.gradle.kts
          grep -q 'assistant_ai_enabled' app/src/main/java/com/carhud/aaproxy/AssistantConfig.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Require EXISTING Play upload signing key (never output unsigned)
        shell: bash
        run: |
          set -euo pipefail
          for key in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Play upload signing key missing::Set GitHub Actions secret $key. This workflow will not distribute an unsigned AAB."
              exit 1
            fi
          done
          mkdir -p "$(dirname "$PLAY_UPLOAD_KEYSTORE_PATH")"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE_PATH"
          chmod 600 "$PLAY_UPLOAD_KEYSTORE_PATH"
          test -s "$PLAY_UPLOAD_KEYSTORE_PATH"
          keytool -list -keystore "$PLAY_UPLOAD_KEYSTORE_PATH" -alias "$PLAY_UPLOAD_KEY_ALIAS" -storepass:env PLAY_UPLOAD_STORE_PASSWORD >/dev/null
          actual_cert_sha="$(keytool -exportcert -keystore "$PLAY_UPLOAD_KEYSTORE_PATH" -alias "$PLAY_UPLOAD_KEY_ALIAS" -storepass:env PLAY_UPLOAD_STORE_PASSWORD | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          if [ -n "${PLAY_UPLOAD_CERT_SHA256:-}" ]; then
            expected_cert_sha="$(printf '%s' "$PLAY_UPLOAD_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            if [ "$actual_cert_sha" != "$expected_cert_sha" ]; then
              echo "::error title=Wrong upload certificate::Upload keystore does not match the SHA-256 fingerprint registered in Play Console."
              exit 1
            fi
          else
            echo "::warning::No PLAY_UPLOAD_CERT_SHA256 set. Confirm upload certificate fingerprint against Play Console before uploading."
          fi
          echo "Upload certificate SHA-256: $actual_cert_sha"
      - name: Verify panel and startup regressions
        run: |
          node --test tests/hey-mimi-panel-ui.test.cjs
          node --test tests/hey-mimi-visible-avatar.test.cjs
          node --test tests/hey-mimi-phone-startup.test.cjs
          node --check backend/mimi-proxy.mjs
      - name: Kotlin assistant, AI and hotword gate unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*AssistantIntentParserTest' --tests '*HeyMimiConversationTest' --tests '*MimiAiPolicyTest' --tests '*MimiHotwordGateTest' --stacktrace --no-daemon
      - name: Release lint
        run: ./gradlew lintRelease --stacktrace --no-daemon
      - name: Build Play release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon
      - name: Inspect AAB structure, version and signing
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -s "$aab"
          unzip -tq "$aab"
          jar tf "$aab" | grep -q '^base/manifest/AndroidManifest.xml$'
          mkdir -p build-output
          cp "$aab" build-output/TTube-Hey-Mimi-v6-1.1.9-build307.aab
          sha256sum build-output/*.aab | tee build-output/SHA256SUMS.txt
          verify_output="$(jarsigner -verify -verbose -certs "$aab" 2>&1)"
          if ! grep -q 'jar verified\.' <<< "$verify_output"; then
            echo "::error::AAB is unsigned or signature verification failed"
            echo "$verify_output" | tail -35
            exit 1
          fi
          echo "SIGNED_WITH_PLAY_UPLOAD_KEY" > build-output/SIGNING_STATUS.txt
          printf 'versionName=1.1.9\nversionCode=307\nbranch=test/hey-mimi-v6-play-aab-build307\n' > build-output/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TTube-Hey-Mimi-v6-1.1.9-build307-SIGNED-Play-AAB
          path: build-output/*
          if-no-files-found: error
          retention-days: 14
