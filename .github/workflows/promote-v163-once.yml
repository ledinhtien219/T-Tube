name: Publish T Tube v1.0.63 Stable (once)

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/promote-v163-once.yml"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: d04f84f34647fdedf48fc932311c11c4b643c1a8
      VERSION_NAME: "1.0.63"
      VERSION_CODE: "250"

    steps:
      - name: Checkout tested official source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          set -e
          grep -q 'versionName = "1.0.63"' app/build.gradle.kts
          grep -q 'versionCode = 250' app/build.gradle.kts
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Prepare release note
        shell: bash
        run: |
          printf '%s\n' '- Bug fix' > /tmp/release-notes.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1

      - name: Ensure stable signing key
        shell: bash
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key missing; publication aborted."
            exit 1
          }

      - name: Run regression tests and build
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          for f in tests/*.cjs; do
            echo "RUN $f"
            node "$f"
          done
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          ASSET="app/build/outputs/apk/debug/TTube_v1.0.63_debug.apk"
          test -f "$ASSET"
          git fetch --tags origin --quiet

          if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "v$VERSION_NAME" 2>/dev/null || true)
            test "$TAG_SHA" = "$TARGET_SHA" || {
              echo "Existing v$VERSION_NAME points to $TAG_SHA, expected $TARGET_SHA"
              exit 1
            }
            echo "Release v$VERSION_NAME already exists at tested commit."
          else
            gh release create "v$VERSION_NAME" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "T Tube v$VERSION_NAME (STABLE)" \
              --notes-file /tmp/release-notes.txt
          fi

      - name: Publish stable OTA manifest and clean one-time workflow
        shell: bash
        run: |
          set -e
          git fetch origin main --quiet
          git checkout -B stable-manifest origin/main

          python3 - <<'PY'
          import datetime, json, pathlib, re

          version = "1.0.63"
          code = 250
          target = "d04f84f34647fdedf48fc932311c11c4b643c1a8"

          manifest = {
              "channel": "stable",
              "approved": True,
              "versionCode": code,
              "versionName": version,
              "downloadUrl": f"https://github.com/ledinhtien219/T-Tube/releases/download/v{version}/TTube_v{version}_debug.apk",
              "approvedCommit": target,
              "approvedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
              "changelog": ["Bug fix"],
          }
          pathlib.Path("update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = re.sub(
              r'- \*\*Public stable OTA:\*\* `v[^\`]+` / Build `\d+`',
              '- **Public stable OTA:** `v1.0.63` / Build `250`',
              text,
          )
          readme.write_text(text, encoding="utf-8")
          PY

          git rm --ignore-unmatch .github/workflows/promote-v163-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json README.md
          git commit -m "Approve v1.0.63 as stable update [skip ci]"
          git push origin HEAD:main
