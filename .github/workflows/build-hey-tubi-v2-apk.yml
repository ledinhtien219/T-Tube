name: Build Hey Tubi v2 debug APK

on:
  push:
    branches: ["test/hey-tubi-v2-apk"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hey-tubi-v2-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply Tubi assistant and two-turn Hey Tubi
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < ci/hey-tubi/TTube_assistant.patch
          patch --batch --forward -p1 < ci/hey-tubi/TTube_HeyTubi_v2.patch
          test -f app/src/main/java/com/carhud/aaproxy/HeyTubiConversation.kt
          test -f app/src/main/java/com/carhud/aaproxy/TtubeAssistant.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing debug certificate when available
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: thtv-stable-debug-keystore-v1
      - name: Ensure debug signing key for sideload testing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "WARNING: Generating a new debug-only key. Existing installations signed with another certificate must be uninstalled first."
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Tubi JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*AssistantIntentParserTest' --tests '*HeyTubiConversationTest' --stacktrace --no-daemon
      - name: Build installable Hey Tubi debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/*.apk
          sha256sum app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TTube-Hey-Tubi-v2-1.1.8-build306-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
