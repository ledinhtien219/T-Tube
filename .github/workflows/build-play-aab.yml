name: Build T Tube Play AAB

on:
  push:
    branches:
      - "release/play"
      - "release/play-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttube-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-play:
    name: Build Play-ready AAB
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/.play/ttube-play-upload.jks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Play build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          package_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version_name"
          test -n "$version_code"
          test -n "$package_id"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "Building $package_id v$version_name ($version_code)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare optional Play upload key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PLAY_UPLOAD_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$(dirname "$PLAY_UPLOAD_KEYSTORE_PATH")"
            printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE_PATH"
            chmod 600 "$PLAY_UPLOAD_KEYSTORE_PATH"
            echo "Play upload keystore restored."
          else
            echo "Play upload secrets are not configured yet; building unsigned AAB for validation."
          fi

      - name: Verify Play source policy gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'applicationId = "com.ledinhtien.ttube"' app/build.gradle.kts
          grep -q 'isDebuggable = false' app/build.gradle.kts
          grep -q '<uses name="media" />' app/src/main/res/xml/automotive_app_desc.xml
          grep -q 'name="service"' app/src/main/res/xml/automotive_app_desc.xml
          grep -q 'name="projection"' app/src/main/res/xml/automotive_app_desc.xml
          grep -q 'CATEGORY_PROJECTION' app/src/main/AndroidManifest.xml
          grep -q 'CarHudProjectionService' app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_SURFACE' app/src/main/AndroidManifest.xml
          ! grep -q 'NAVIGATION_TEMPLATES' app/src/main/AndroidManifest.xml
          grep -q 'implementation(files("libs/aauto.aar"))' app/build.gradle.kts
          test -f app/src/main/java/com/carhud/aaproxy/CarHudProjectionHost.kt
          test -f app/src/main/java/com/carhud/aaproxy/StableProjectionHost.kt

      - name: Run Play static regression tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/app-switching.test.cjs
            tests/audio-handoff-autonext.test.cjs
            tests/google-maps-handoff.test.cjs
            tests/iptv-aspect.test.cjs
            tests/projection-viewport.test.cjs
            tests/tiktok-phone-layout.test.cjs
            tests/youtube-quality.test.cjs
            tests/youtube-screen-settings.test.cjs
            tests/youtube-search-routing.test.cjs
            tests/youtube-theme.test.cjs
            tests/youtube-voice-toolbar.test.cjs
            tests/web-login-streaming.test.cjs
          )
          for f in "${tests[@]}"; do
            echo "==> $f"
            node "$f"
          done

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run release lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build Play App Bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify merged release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml | head -1)"
          test -n "$manifest"
          echo "Merged manifest: $manifest"
          grep -q 'CATEGORY_PROJECTION' "$manifest"
          grep -q 'CarHudProjectionService' "$manifest"
          grep -q 'android.media.browse.MediaBrowserService' "$manifest"
          ! grep -q 'androidx.car.app.ACCESS_SURFACE' "$manifest"
          ! grep -q 'androidx.car.app.NAVIGATION_TEMPLATES' "$manifest"

      - name: Verify AAB signature when upload key is configured
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -n "$aab"
          if [ -f "$PLAY_UPLOAD_KEYSTORE_PATH" ]; then
            jarsigner -verify -verbose -certs "$aab" >/dev/null
            echo "Signed AAB verified."
          else
            echo "Unsigned validation AAB: configure Play upload secrets before Play Console upload."
          fi

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: TTube-v${{ steps.meta.outputs.version_name }}-build${{ steps.meta.outputs.version_code }}-${{ steps.meta.outputs.package_id }}-Full-AA-Internal-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
