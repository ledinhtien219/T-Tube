<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>T-Tube · Dẫn đường trong màn chia đôi</title>
<link rel="stylesheet" href="leaflet.css"><script src="leaflet.js"></script>
<style>
*{box-sizing:border-box}body,html,#map{width:100%;height:100%;margin:0;background:#e6edf1;font-family:Arial,Helvetica,sans-serif}
#map{position:absolute;inset:0}#panel{position:absolute;top:7px;left:7px;right:7px;z-index:950;background:#10243ded;color:white;border-radius:13px;padding:13px 14px;box-shadow:0 4px 13px #0006;pointer-events:none}
#maneuver{font-size:21px;font-weight:700;line-height:1.2}#distance{font-size:15px;color:#7ee2ff;margin-top:5px;font-weight:600}
#meta{font-size:13px;color:#e5e7eb;margin-top:8px}
#status{position:absolute;left:8px;right:8px;bottom:52px;z-index:955;border-radius:11px;background:#fffef9ed;color:#182b44;padding:10px 12px;font-size:14px;box-shadow:0 2px 12px #0005}
#stop{position:absolute;bottom:10px;left:10px;z-index:1000;background:#b91c1c;color:white;border:0;border-radius:12px;padding:10px 20px;font-weight:700;font-size:15px;min-height:40px}
#follow{position:absolute;bottom:10px;right:10px;z-index:1000;background:#14427e;color:white;border:0;border-radius:12px;padding:10px 15px;font-weight:700;font-size:15px;min-height:40px}
.leaflet-control-attribution{font-size:10px!important;background:#ffffffde!important}
</style>
</head><body>
<div id="map"></div>
<div id="panel"><div id="maneuver">Đang chuẩn bị tuyến đường…</div><div id="distance">Chờ vị trí GPS</div><div id="meta">T-Tube · Dẫn đường thử nghiệm</div></div>
<div id="status">Đang khởi tạo GPS và dữ liệu bản đồ…</div>
<button id="stop" onclick="window.AndroidSplitMaps&&AndroidSplitMaps.stopNavigation()">■ Kết thúc</button>
<button id="follow" onclick="recenter()">◎ Vị trí</button>
<script>
(function(){
'use strict';
var map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([21.0285,105.8542],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
var marker=null,line=null,destinationMarker=null,route=null,destination=null,position=null,routeCoords=[],steps=[],cumulative=[],active=false,follow=true;
var lastRouteAt=0,lastRecalcAt=0,lastDistance=Infinity,routePending=false,routeVersion=0,lastGpsAt=0;
var statusEl=document.getElementById('status'),nextEl=document.getElementById('maneuver'),distanceEl=document.getElementById('distance'),metaEl=document.getElementById('meta');
function status(text){statusEl.textContent=text;}
function km(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';}
function distanceM(a,b){
 var dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
 var s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
 return 12742000*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function stepText(step){
 var m=step.maneuver||{},road=(step.name||'').trim(),type=m.type||'',modifier=m.modifier||'';
 var label={
 'turn':'Rẽ','new name':'Đi tiếp','merge':'Nhập làn','on ramp':'Lên đường nhánh','off ramp':'Rời đường chính',
 'fork':'Rẽ nhánh','roundabout':'Vào vòng xuyến','rotary':'Vào vòng xoay','continue':'Đi tiếp',
 'depart':'Xuất phát','arrive':'Đã đến nơi','end of road':'Đến cuối đường','notification':'Lưu ý'
 }[type]||'Đi tiếp';
 if(type==='arrive')return 'Đã đến điểm đến';
 if(modifier==='left'||modifier==='slight left')label+=' trái';
 else if(modifier==='right'||modifier==='slight right')label+=' phải';
 else if(modifier==='sharp left')label+=' gấp trái';
 else if(modifier==='sharp right')label+=' gấp phải';
 else if(modifier==='uturn')label+=' quay đầu';
 else if(modifier==='straight')label+=' thẳng';
 return label+(road?' · '+road:'');
}
function displayError(message){
 active=false;nextEl.textContent='Chưa thể bắt đầu dẫn đường';
 distanceEl.textContent=''; status(message+' · Kiểm tra GPS và kết nối mạng, rồi thử lại.');
}
function parseDestination(text){
 var v=String(text||'').trim();
 var p=v.match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
 if(p){var lat=+p[1],lng=+p[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return Promise.resolve({lat:lat,lng:lng,name:v});}
 var url='https://photon.komoot.io/api/?q='+encodeURIComponent(v)+'&limit=5'+(position?'&lat='+position.lat+'&lon='+position.lng:'');
 return fetch(url).then(function(r){if(!r.ok)throw Error('search');return r.json();}).then(function(json){
  var results=json.features||[];
  if(!results.length)throw Error('not found');
  var first=results[0],c=first.geometry.coordinates;
  return {lat:c[1],lng:c[0],name:v};
 }).catch(function(){
  return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(v))
  .then(function(r){if(!r.ok)throw Error('search');return r.json();})
  .then(function(rows){if(!rows.length)throw Error('not found');return {lat:+rows[0].lat,lng:+rows[0].lon,name:v};});
 });
}
function redraw(){
 if(!route)return;
 var data=route;
 routeCoords=data.geometry.coordinates.map(function(c){return [c[1],c[0]];});
 if(line)map.removeLayer(line);
 line=L.polyline(routeCoords,{color:'#2563eb',weight:7,opacity:0.92}).addTo(map);
 if(destinationMarker)map.removeLayer(destinationMarker);
 destinationMarker=L.circleMarker([destination.lat,destination.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map);
 if(!active)map.fitBounds(line.getBounds(),{padding:[70,22]});
 cumulative=[0];
 for(var j=1;j<routeCoords.length;j++){
  cumulative[j]=cumulative[j-1]+distanceM(
   {lat:routeCoords[j-1][0],lng:routeCoords[j-1][1]},
   {lat:routeCoords[j][0],lng:routeCoords[j][1]});
 }
 steps=[];
 (data.legs||[]).forEach(function(leg){(leg.steps||[]).forEach(function(step){
  var loc=step.maneuver&&step.maneuver.location;
  if(!loc)return;
  var best=0,min=Infinity;
  for(var i=0;i<routeCoords.length;i+=Math.max(1,Math.floor(routeCoords.length/1200))){
   var d=distanceM({lat:loc[1],lng:loc[0]},{lat:routeCoords[i][0],lng:routeCoords[i][1]});
   if(d<min){min=d;best=i;}
  }
  step.routeIndex=best;steps.push(step);
 });});
 steps.sort(function(a,b){return a.routeIndex-b.routeIndex;});
 active=true;lastRouteAt=Date.now();lastDistance=Infinity;
 updateInstruction();
 status('Đang dẫn đường · vị trí cập nhật theo GPS. Tuyến OSM/OSRM có thể khác Google Maps.');
 if(position)map.setView([position.lat,position.lng],Math.max(map.getZoom(),16),{animate:false});
}
function calculateRoute(force){
 if(!destination||!position||routePending)return;
 if(!force&&Date.now()-lastRecalcAt<25000)return;
 lastRecalcAt=Date.now();routePending=true;
 var version=++routeVersion;
 status('Đang tính tuyến từ vị trí hiện tại…');
 var url='https://router.project-osrm.org/route/v1/driving/'+position.lng+','+position.lat+';'+destination.lng+','+destination.lat+
   '?overview=full&geometries=geojson&steps=true';
 fetch(url).then(function(r){if(!r.ok)throw Error('server '+r.status);return r.json();}).then(function(data){
  if(version!==routeVersion)return;
  routePending=false;
  if(!data.routes||!data.routes.length)throw Error('no route');
  route=data.routes[0];redraw();
 }).catch(function(e){
  routePending=false;
  if(route){status('Mất kết nối tính tuyến mới. Đang giữ tuyến cũ; đối chiếu biển báo đường.');}
  else displayError('Không tính được tuyến: '+String(e.message||e));
 });
}
function nearestRoutePoint(){
 if(!routeCoords.length||!position)return {index:0,distance:Infinity};
 var min=Infinity,best=0,limit=routeCoords.length;
 for(var i=0;i<limit;i+=Math.max(1,Math.floor(limit/1500))){
  var d=distanceM(position,{lat:routeCoords[i][0],lng:routeCoords[i][1]});
  if(d<min){min=d;best=i;}
 }
 // Refine around the best sampled coordinate for accurate turn progress.
 var stride=Math.max(1,Math.floor(limit/1500));
 for(var j=Math.max(0,best-stride);j<=Math.min(limit-1,best+stride);j++){
  var d2=distanceM(position,{lat:routeCoords[j][0],lng:routeCoords[j][1]});
  if(d2<min){min=d2;best=j;}
 }
 return {index:best,distance:min};
}
function updateInstruction(){
 if(!position)return;
 if(destination&&distanceM(position,destination)<35){
  nextEl.textContent='Đã gần tới điểm đến';distanceEl.textContent='Còn dưới 35 m';
  metaEl.textContent=destination.name;status('Đã tới khu vực điểm đến. Kiểm tra lối vào thực tế.');
  return;
 }
 if(!route||!routeCoords.length)return;
 var progress=nearestRoutePoint(),idx=progress.index;
 var next=null;
 for(var i=0;i<steps.length;i++){
  var step=steps[i],type=(step.maneuver||{}).type;
  if(type==='depart')continue;
  if(step.routeIndex>idx+1){next=step;break;}
 }
 if(!next)next=steps[steps.length-1]||null;
 if(next){
  var nextIndex=Math.min(next.routeIndex,cumulative.length-1);
  var toTurn=Math.max(0,(cumulative[nextIndex]||0)-(cumulative[idx]||0));
  nextEl.textContent=stepText(next);
  distanceEl.textContent=km(toTurn)+' tới thao tác tiếp theo';
 }
 var total=cumulative.length?cumulative[cumulative.length-1]:route.distance;
 var remain=Math.max(0,total-(cumulative[idx]||0));
 var eta=Math.ceil((route.duration||0)*(remain/Math.max(total,1))/60);
 metaEl.textContent='Còn '+km(remain)+' · khoảng '+eta+' phút · '+destination.name;
}
function recenter(){follow=true;if(position)map.setView([position.lat,position.lng],17,{animate:true});}
window.recenter=recenter;
map.on('dragstart',function(){follow=false;});
window.ttubeNav={
 begin:function(dest){
  var value=String(dest||'').trim();
  if(!value){displayError('Chưa có điểm đến. Quay lại Maps và nhập điểm đến.');return;}
  nextEl.textContent='Đang tìm điểm đến…';status('Đang tìm: '+value);
  parseDestination(value).then(function(found){
   destination=found;nextEl.textContent='Đã xác định điểm đến';
   if(position)calculateRoute(true);else status('Đã tìm điểm đến. Đang chờ GPS hiện tại để tính tuyến.');
  }).catch(function(){displayError('Không tìm thấy điểm đến chính xác: '+value);});
 },
 updatePosition:function(lat,lng,bearing,speed,age){
  lat=+lat;lng=+lng;
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return;
  if(+age>30000){status('Vị trí GPS đã cũ, đang chờ tín hiệu mới.');return;}
  position={lat:lat,lng:lng};lastGpsAt=Date.now();
  if(!marker){
   marker=L.circleMarker([lat,lng],{radius:10,color:'#fff',weight:3,fillColor:'#0068df',fillOpacity:1}).addTo(map);
   map.setView([lat,lng],16,{animate:false});
  }else marker.setLatLng([lat,lng]);
  if(follow)map.panTo([lat,lng],{animate:true,duration:0.35});
  if(destination&&!route)calculateRoute(true);
  if(active){
   updateInstruction();
   if(nearestRoutePoint().distance>85&&Date.now()-lastRecalcAt>25000)calculateRoute(false);
  }
 }
};
setInterval(function(){
 if(!lastGpsAt||Date.now()-lastGpsAt>30000)status('Chưa có GPS mới. Không dùng tuyến này để rẽ nếu vị trí bị lệch.');
},10000);
})();
</script>
</body></html>
